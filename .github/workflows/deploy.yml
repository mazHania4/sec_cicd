# CI, PRUEBAS AUTOMÁTICAS Y RAMAS
#   - El pipeline ya NO corre directo sobre main. Corre sobre pull_request
#   - Las pruebas unitarias se ejecutan de forma obligatoria


name: Deploy mejorado [CI, pruebas automáticas y manejo de ramas]

on:
  pull_request:
    branches: [main]

permissions: write-all

jobs:
  ci-tests:
    name: ci-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Ejecutar pruebas unitarias
        run: ./mvnw test

  build-and-deploy:
    name: Empaquetado y despliegue
    needs: ci-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar (sin ejecutar pruebas)
        run: ./mvnw package -DskipTests

      - name: Copiar JAR a EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.jar"
          target: "~/spring_backend/"
          strip_components: 1

      - name: Reiniciar app en EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl restart spring_backend